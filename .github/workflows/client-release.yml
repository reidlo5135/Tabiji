# 클라이언트 릴리스: client-vX.Y.Z 태그를 push하면 Desktop 설치 파일(+ 시크릿이 있으면 서명된 Android)을
# 만들어 GitHub Release로 바로 공개한다. 같은 태그로 다시 돌리면(workflow_dispatch) 기존 Release의 에셋을 교체한다.
# 절차: docs/github.md "6. 태그 · 버전 · 릴리스" / Action 버전 근거: docs/decisions/0002-toolchain-versions.md

name: client-release

on:
  push:
    tags: ["client-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "다시 빌드할 기존 태그 (예: client-v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # 같은 태그의 릴리스는 한 번에 하나만. 진행 중인 릴리스를 중간에 끊지 않는다
  group: client-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── 1. 태그·버전·CHANGELOG 검증 ─────────────────────────
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Validate tag name
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^client-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::태그 형식이 client-vX.Y.Z 가 아니에요: $TAG"
            exit 1
          fi
          version="${TAG#client-v}"
          major="${BASH_REMATCH[1]}"
          prerelease=false
          if [[ "$major" == "0" ]]; then prerelease=true; fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}
          persist-credentials: false

      - name: Check tabiji.version matches tag
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          prop="$(grep -E '^tabiji\.version=' client/gradle.properties | head -n1 | cut -d= -f2 | tr -d '[:space:]')"
          if [[ "$prop" != "$VERSION" ]]; then
            echo "::error file=client/gradle.properties::tabiji.version($prop)이 태그 버전($VERSION)과 달라요."
            exit 1
          fi
          echo "tabiji.version = $prop (태그와 일치)"

      - name: Extract release notes from CHANGELOG.md (## Client → ### [X.Y.Z])
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if ! awk -v ver="$VERSION" '
            /^## / { in_client = ($0 ~ /^## Client[[:space:]]*$/); in_ver = 0; next }
            in_client && /^### / { in_ver = (index($0, "### [" ver "]") == 1); if (in_ver) found = 1; next }
            in_ver { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md; then
            echo "::error file=CHANGELOG.md::'## Client' 아래에 '### [$VERSION]' 섹션이 없어요."
            exit 1
          fi
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error file=CHANGELOG.md::'### [$VERSION]' 섹션이 비어 있어요."
            exit 1
          fi
          cat release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  # ── 2. Desktop 설치 파일 (OS별) ─────────────────────────
  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            format: deb
            label: linux
          - os: windows-latest
            format: msi
            label: windows
          - os: macos-latest
            format: dmg
            label: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      # scripts/linux/package-desktop.sh 와 같은 태스크
      - name: Package (${{ matrix.format }})
        run: ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS

      - name: Rename to Tabiji-<version>-<os>.<ext>
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          FORMAT: ${{ matrix.format }}
          LABEL: ${{ matrix.label }}
        run: |
          src_dir="desktopApp/build/compose/binaries/main-release/$FORMAT"
          # macOS 러너의 bash는 3.2라 mapfile이 없다 → while read로 모은다
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(find "$src_dir" -maxdepth 1 -type f -name "*.$FORMAT")
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "::error::$src_dir 에서 .$FORMAT 파일을 정확히 1개 찾지 못했어요 (${#files[@]}개)."
            ls -la "$src_dir" || true
            exit 1
          fi
          mkdir -p ../dist
          cp "${files[0]}" "../dist/Tabiji-$VERSION-$LABEL.$FORMAT"
          ls -la ../dist

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabiji-desktop-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ── 3. Android (서명 시크릿이 모두 있을 때만) ─────────────
  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.signing.outputs.available }}
    defaults:
      run:
        working-directory: client
    steps:
      # 시크릿은 if: 조건에 직접 못 쓰므로 존재 여부를 출력값으로 만든다. 하나라도 없으면 이후 단계 전부 건너뜀(성공)
      - name: Check signing secrets
        id: signing
        working-directory: .
        env:
          KEYSTORE_BASE64: ${{ secrets.TABIJI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TABIJI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TABIJI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TABIJI_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=client-release::Android 서명 시크릿이 없어 Android 빌드를 건너뜁니다 (docs/github.md 8-6)."
          fi

      - name: Checkout tag
        if: steps.signing.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - name: Set up JDK 17 (Temurin)
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.signing.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Restore keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.TABIJI_KEYSTORE_BASE64 }}
        run: |
          keystore="$RUNNER_TEMP/tabiji-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "TABIJI_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      # androidApp/build.gradle.kts 가 네 환경변수를 보고 release 서명을 적용한다
      - name: Build signed APK and AAB
        if: steps.signing.outputs.available == 'true'
        env:
          TABIJI_KEYSTORE_PASSWORD: ${{ secrets.TABIJI_KEYSTORE_PASSWORD }}
          TABIJI_KEY_ALIAS: ${{ secrets.TABIJI_KEY_ALIAS }}
          TABIJI_KEY_PASSWORD: ${{ secrets.TABIJI_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease

      - name: Rename to Tabiji-<version>-android.<ext>
        if: steps.signing.outputs.available == 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p ../dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "../dist/Tabiji-$VERSION-android.apk"
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab "../dist/Tabiji-$VERSION-android.aab"
          ls -la ../dist

      - name: Upload artifact
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabiji-android
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove keystore
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/tabiji-release.jks"

  # ── 4. 체크섬 + GitHub Release 공개 ─────────────────────
  publish:
    needs: [verify, desktop, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tabiji-*
          merge-multiple: true
          path: dist

      - name: Write SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum Tabiji-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Compose release body
        env:
          SIGNED: ${{ needs.android.outputs.signed }}
        run: |
          {
            cat notes/release-notes.md
            echo
            if [[ "$SIGNED" != "true" ]]; then
              echo "> Android 서명 빌드 미포함"
              echo
            fi
            echo "## 체크섬 (SHA-256)"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo '검증: `sha256sum -c SHA256SUMS.txt --ignore-missing`'
            echo
            echo "## macOS에서 처음 실행하기"
            echo
            echo "이 앱은 Apple 개발자 서명·공증을 하지 않았어요. \"손상되었거나 확인되지 않은 개발자\" 경고가 뜨면:"
            echo
            echo "1. \`.dmg\`를 열어 Tabiji를 응용 프로그램 폴더로 옮긴 뒤, Finder에서 앱을 **Control-클릭 → 열기**"
            echo "2. 그래도 막히면 터미널에서 \`xattr -dr com.apple.quarantine /Applications/Tabiji.app\`"
          } > release-body.md
          cat release-body.md

      # 새 태그면 바로 공개(draft 아님), 이미 있으면 본문·에셋을 교체한다
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          title="Tabiji Client $VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "기존 Release를 갱신해요: $TAG"
            gh release edit "$TAG" --title "$title" --notes-file release-body.md \
              --draft=false --prerelease="$PRERELEASE"
            # 이번 빌드에 없는 예전 에셋은 지운다 (예: 이번엔 Android 미포함)
            while IFS= read -r asset; do
              if [[ -n "$asset" && ! -f "dist/$asset" ]]; then
                gh release delete-asset "$TAG" "$asset" --yes
              fi
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" dist/* --verify-tag --title "$title" \
              --notes-file release-body.md "${flags[@]}"
          fi
