<!doctype html>
<!-- Tabiji 旅路 v2 진실 소스 — 기본(cloud) 테마로 렌더됨.
     테마 전환 = .v2 루트에 클래스 추가(spring/summer/autumn/winter/korea/china/japan).
     구현 수치·색의 최종 기준은 tokens/tokens.json (보드와 미세 차이 시 tokens.json 우선). -->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Tabiji 공통 상태 v2 · Phone</title>
<style>@font-face{font-family:"Jua";font-weight:400;src:url(../assets/fonts/Jua-Regular.ttf) format("truetype")}</style>
<style>
@font-face{font-family:"Pretendard";font-weight:400;src:url(../assets/fonts/PretendardJP-Regular.ttf) format("truetype")}
@font-face{font-family:"Pretendard";font-weight:600;src:url(../assets/fonts/PretendardJP-SemiBold.ttf) format("truetype")}
body{margin:0;font-family:"Pretendard",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#2F5E9E}a:hover{color:#3E8FC7}
.v2{--paper:#F2F7FC;--stripe:#E8F1F9;--ink:#2A3644;--card:#FFFFFF;--accent:#3E8FC7;--sub:#5B6878;--h1:#4A8FC2;--h2:#5F74B8;--h3:#4A9A93;--soft:#EAF3FB;--shadow:rgba(42,54,68,.22);--est:#E3A23B;--err:#C0463C;--errsoft:#F7E3E0;--skel:#DEE6EE}
.v2.spring{--paper:#FCF3F5;--stripe:#F7E8EC;--ink:#43313A;--card:#FFFFFF;--accent:#C95E7E;--sub:#6E5A63;--h1:#C95E7E;--h2:#7FA255;--h3:#9A77C2;--soft:#F9E9EE;--shadow:rgba(67,49,58,.22);--skel:#EEDDE2}
.v2.summer{--paper:#EFF9FB;--stripe:#E2F2F6;--ink:#1E3B4C;--card:#FFFFFF;--accent:#1F96B8;--sub:#4E6B7A;--h1:#1F96B8;--h2:#2C7FC9;--h3:#2E9E85;--soft:#E2F4F8;--shadow:rgba(30,59,76,.22);--skel:#D8EBF1}
.v2.autumn{--paper:#FBF3E6;--stripe:#F4E8D3;--ink:#46321F;--card:#FFFDF8;--accent:#C97A2E;--sub:#77614A;--h1:#C97A2E;--h2:#A8891F;--h3:#B35C3B;--soft:#F7EAD6;--shadow:rgba(70,50,31,.22);--skel:#ECDFC8}
.v2.winter{--paper:#F1F5FA;--stripe:#E6EDF6;--ink:#2A3650;--card:#FFFFFF;--accent:#5674AE;--sub:#5B6880;--h1:#5674AE;--h2:#7585C2;--h3:#7E6FB5;--soft:#E8EEF8;--shadow:rgba(42,54,80,.22);--skel:#DCE4F0}
.v2.korea{--paper:#FAF4EA;--stripe:#F2E9DA;--ink:#30261C;--card:#FFFCF5;--accent:#2F5E9E;--sub:#6B5D4A;--h1:#2F5E9E;--h2:#BE4450;--h3:#2E7D5B;--soft:#EDE4D2;--shadow:rgba(48,38,28,.22);--skel:#E8DFCF}
.v2.china{--paper:#FCF2EA;--stripe:#F6E6D8;--ink:#3C241C;--card:#FFFAF3;--accent:#BE4435;--sub:#7A5A48;--h1:#BE4435;--h2:#C2922A;--h3:#357F63;--soft:#F6E3D6;--shadow:rgba(60,36,28,.22);--skel:#EFDFD2}
.v2.japan{--paper:#F6F5F0;--stripe:#ECEAE2;--ink:#2B2B30;--card:#FFFEFA;--accent:#2B4C7E;--sub:#5F5F66;--h1:#2B4C7E;--h2:#C25548;--h3:#6E7F49;--soft:#E9E7DC;--shadow:rgba(43,43,48,.22);--skel:#E2E0D6}
.h{font-family:'Jua','Pretendard',sans-serif;font-weight:400}
.sk{border-radius:6px;background:var(--skel)}
.sec{border:2px solid var(--ink);border-radius:10px;background:var(--card);box-shadow:3px 3px 0 var(--shadow);overflow:hidden}
.sechead{height:32px;display:flex;align-items:center;padding:0 10px;color:#FFFFFF;border-bottom:2px solid var(--ink);font-family:'Jua','Pretendard',sans-serif;font-size:14px}
</style>
</head>
<body>
<div class="v2" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: 'Pretendard', system-ui, sans-serif; color: var(--ink); background: var(--paper); background-image: repeating-linear-gradient(45deg, transparent 0 14px, var(--stripe) 14px 28px)">
  <div style="position: absolute; inset: 0; overflow-y: auto; padding: 48px 14px 28px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">

    <section class="sec">
      <div class="sechead" style="background: var(--h2)">오프라인 필</div>
      <div style="position: relative; height: 86px; overflow: hidden">
        <img src="../assets/map/map_light.svg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.55)">
        <div role="status" class="h" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--ink); background: var(--card); box-shadow: 0 3px 0 var(--shadow); font-size: 13px; color: var(--ink); white-space: nowrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--sub)"><path d="M3 3l18 18"/><path d="M8.5 19H17a4 4 0 0 0 .9-7.9A6 6 0 0 0 7.6 8.6"/><path d="M5.3 9.6A4.5 4.5 0 0 0 7.5 19h1"/></svg>오프라인 · 저장된 일정 표시 중
        </div>
      </div>
    </section>

    <section class="sec">
      <div class="sechead" style="background: var(--err)">오류 배너 (콘텐츠 유지)</div>
      <div style="padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--soft)">
        <div role="alert" style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 2px solid var(--err); border-radius: 9px; background: var(--errsoft)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--err)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v5M12 16h.01"/></svg>
          <span style="font-size: 12px; font-weight: 600; flex: 1; line-height: 16px">이동시간을 불러오지 못했어요. 마지막 값 표시 중</span>
          <button type="button" class="h" style="height: 30px; padding: 0 10px; border-radius: 8px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); font-size: 12px; cursor: pointer; box-shadow: 0 2px 0 var(--shadow); white-space: nowrap">다시 시도</button>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; padding-left: 8px"><span style="width: 3px; height: 20px; background: var(--h2)"></span><span style="display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; border: 2px dashed var(--ink); background: var(--card); font-size: 11px; font-weight: 600; color: var(--sub)">도보 14분 · 재계산 필요</span></div>
      </div>
    </section>

    <section class="sec" aria-busy="true">
      <div class="sechead" style="background: var(--h1)">로딩 스켈레톤</div>
      <div style="padding: 10px; display: flex; flex-direction: column; gap: 7px; background: var(--soft)">
        <div style="border: 2px solid var(--ink); border-radius: 9px; background: var(--card); overflow: hidden">
          <div style="height: 26px; background: var(--skel); border-bottom: 2px solid var(--ink)"></div>
          <div style="padding: 8px 9px; display: flex; flex-direction: column; gap: 6px"><span class="sk" style="width: 50%; height: 11px"></span><span class="sk" style="width: 68%; height: 9px"></span></div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; padding-left: 8px"><span style="width: 3px; height: 18px; background: var(--skel)"></span><span class="sk" style="width: 110px; height: 22px; border-radius: 999px; border: 2px solid var(--ink)"></span></div>
        <div style="border: 2px solid var(--ink); border-radius: 9px; background: var(--card); overflow: hidden">
          <div style="height: 26px; background: var(--skel); border-bottom: 2px solid var(--ink)"></div>
          <div style="padding: 8px 9px; display: flex; flex-direction: column; gap: 6px"><span class="sk" style="width: 60%; height: 11px"></span><span class="sk" style="width: 40%; height: 9px"></span></div>
        </div>
      </div>
    </section>

    <section class="sec">
      <div class="sechead" style="background: var(--h3)">빈 상태</div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 14px; text-align: center; background: var(--card)">
        <svg width="50" height="50" viewBox="0 0 44 54" aria-hidden="true"><path d="M22 2 C11 2 2 11 2 22 C2 36 22 52 22 52 C22 52 42 36 42 22 C42 11 33 2 22 2 Z" fill="var(--soft)" stroke="var(--ink)" stroke-width="2.5"/><circle cx="22" cy="22" r="13" fill="#FFFFFF" stroke="var(--ink)" stroke-width="2"/><path d="M22 16v12M16 22h12" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/></svg>
        <span class="h" style="font-size: 16px">아직 여행이 없어요</span>
        <span style="font-size: 12px; color: var(--sub); line-height: 16px">지역과 날짜만 정하면<br>바로 일정을 만들 수 있어요</span>
        <button type="button" class="h" style="height: 42px; padding: 0 18px; border: 2px solid var(--ink); border-radius: 9px; background: var(--accent); color: #FFFFFF; font-size: 15px; cursor: pointer; box-shadow: 0 3px 0 var(--ink)">첫 여행 만들기</button>
      </div>
    </section>
  </div>
</div>

<!-- ▼ 미리보기 전용 테마 셀렉터 — 구현 대상 아님. 앱에서는 설정 화면의 테마 선택이 이 역할을 한다. -->
<select id="themePreview" aria-label="테마 미리보기"
 style="position:fixed;right:10px;bottom:10px;z-index:9999;font:600 12px system-ui;padding:4px 6px;
 border:2px solid #2A3644;border-radius:8px;background:#FFF;box-shadow:0 2px 0 rgba(42,54,68,.3)"
 onchange="var r=document.querySelector('.v2');r.className='v2'+(this.value==='cloud'?'':' '+this.value)">
<option value="cloud">cloud (기본)</option><option>spring</option><option>summer</option><option>autumn</option>
<option>winter</option><option>korea</option><option>china</option><option>japan</option>
</select>
<!-- ▲ 미리보기 전용 끝 -->
</body>
</html>
