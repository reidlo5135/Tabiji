<!doctype html>
<!-- Tabiji 旅路 v2 진실 소스 — 기본(cloud) 테마로 렌더됨.
     테마 전환 = .v2 루트에 클래스 추가(spring/summer/autumn/winter/korea/china/japan).
     구현 수치·색의 최종 기준은 tokens/tokens.json (보드와 미세 차이 시 tokens.json 우선). -->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Tabiji 플래너 v2 · Phone</title>
<style>@font-face{font-family:"Jua";font-weight:400;src:url(../assets/fonts/Jua-Regular.ttf) format("truetype")}</style>
<style>
@font-face{font-family:"Pretendard";font-weight:400;src:url(../assets/fonts/PretendardJP-Regular.ttf) format("truetype")}
@font-face{font-family:"Pretendard";font-weight:600;src:url(../assets/fonts/PretendardJP-SemiBold.ttf) format("truetype")}
@font-face{font-family:"Pretendard";font-weight:700;src:url(../assets/fonts/PretendardJP-Bold.ttf) format("truetype")}
body{margin:0;font-family:"Pretendard",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#2F5E9E}a:hover{color:#3E8FC7}
.v2{--paper:#F2F7FC;--stripe:#E8F1F9;--ink:#2A3644;--card:#FFFFFF;--accent:#3E8FC7;--sub:#5B6878;--h1:#4A8FC2;--h2:#5F74B8;--h3:#4A9A93;--soft:#EAF3FB;--shadow:rgba(42,54,68,.22);--est:#E3A23B;--err:#C0463C;--errsoft:#F7E3E0}
.v2.spring{--paper:#FCF3F5;--stripe:#F7E8EC;--ink:#43313A;--card:#FFFFFF;--accent:#C95E7E;--sub:#6E5A63;--h1:#C95E7E;--h2:#7FA255;--h3:#9A77C2;--soft:#F9E9EE;--shadow:rgba(67,49,58,.22)}
.v2.summer{--paper:#EFF9FB;--stripe:#E2F2F6;--ink:#1E3B4C;--card:#FFFFFF;--accent:#1F96B8;--sub:#4E6B7A;--h1:#1F96B8;--h2:#2C7FC9;--h3:#2E9E85;--soft:#E2F4F8;--shadow:rgba(30,59,76,.22)}
.v2.autumn{--paper:#FBF3E6;--stripe:#F4E8D3;--ink:#46321F;--card:#FFFDF8;--accent:#C97A2E;--sub:#77614A;--h1:#C97A2E;--h2:#A8891F;--h3:#B35C3B;--soft:#F7EAD6;--shadow:rgba(70,50,31,.22)}
.v2.winter{--paper:#F1F5FA;--stripe:#E6EDF6;--ink:#2A3650;--card:#FFFFFF;--accent:#5674AE;--sub:#5B6880;--h1:#5674AE;--h2:#7585C2;--h3:#7E6FB5;--soft:#E8EEF8;--shadow:rgba(42,54,80,.22)}
.v2.korea{--paper:#FAF4EA;--stripe:#F2E9DA;--ink:#30261C;--card:#FFFCF5;--accent:#2F5E9E;--sub:#6B5D4A;--h1:#2F5E9E;--h2:#BE4450;--h3:#2E7D5B;--soft:#EDE4D2;--shadow:rgba(48,38,28,.22)}
.v2.china{--paper:#FCF2EA;--stripe:#F6E6D8;--ink:#3C241C;--card:#FFFAF3;--accent:#BE4435;--sub:#7A5A48;--h1:#BE4435;--h2:#C2922A;--h3:#357F63;--soft:#F6E3D6;--shadow:rgba(60,36,28,.22)}
.v2.japan{--paper:#F6F5F0;--stripe:#ECEAE2;--ink:#2B2B30;--card:#FFFEFA;--accent:#2B4C7E;--sub:#5F5F66;--h1:#2B4C7E;--h2:#C25548;--h3:#6E7F49;--soft:#E9E7DC;--shadow:rgba(43,43,48,.22)}
.h{font-family:'Jua','Pretendard',sans-serif;font-weight:400}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:1.5px solid var(--ink);background:var(--card);font-size:12px;font-weight:600;color:var(--ink)}
</style>
</head>
<body>
<div class="v2" style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: 'Pretendard', system-ui, sans-serif; color: var(--ink); background: var(--paper); background-image: repeating-linear-gradient(45deg, transparent 0 14px, var(--stripe) 14px 28px)">

  <div style="position: absolute; left: 12px; right: 12px; top: 64px; bottom: 396px; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; box-shadow: 3px 3px 0 var(--shadow)">
    <img src="../assets/map/map_light.svg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 40% 40%">
    <svg viewBox="0 0 366 380" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
      <path d="M 80 180 L 180 130" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 11"/>
      <path d="M 198 146 C 250 190, 268 200, 282 240" fill="none" stroke="var(--h2)" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <svg width="32" height="40" viewBox="0 0 36 44" aria-hidden="true" style="position: absolute; left: 52px; top: 148px"><path d="M18 2 C9 2 2 9 2 18 C2 29 18 42 18 42 C18 42 34 29 34 18 C34 9 27 2 18 2 Z" fill="var(--h1)" stroke="var(--ink)" stroke-width="2.5"/><circle cx="18" cy="18" r="11" fill="#FFFFFF" stroke="var(--ink)" stroke-width="2"/><text x="18" y="23" text-anchor="middle" font-family="Jua, Pretendard, sans-serif" font-size="14" fill="var(--ink)">1</text></svg>
    <svg width="40" height="50" viewBox="0 0 44 54" aria-hidden="true" style="position: absolute; left: 166px; top: 96px; filter: drop-shadow(2px 3px 0 var(--shadow))"><path d="M22 2 C11 2 2 11 2 22 C2 36 22 52 22 52 C22 52 42 36 42 22 C42 11 33 2 22 2 Z" fill="var(--accent)" stroke="var(--ink)" stroke-width="3"/><circle cx="22" cy="22" r="13.5" fill="#FFFFFF" stroke="var(--ink)" stroke-width="2.5"/><text x="22" y="28" text-anchor="middle" font-family="Jua, Pretendard, sans-serif" font-size="17" fill="var(--ink)">2</text></svg>
    <svg width="32" height="40" viewBox="0 0 36 44" aria-hidden="true" style="position: absolute; left: 262px; top: 222px"><path d="M18 2 C9 2 2 9 2 18 C2 29 18 42 18 42 C18 42 34 29 34 18 C34 9 27 2 18 2 Z" fill="var(--h3)" stroke="var(--ink)" stroke-width="2.5"/><circle cx="18" cy="18" r="11" fill="#FFFFFF" stroke="var(--ink)" stroke-width="2"/><text x="18" y="23" text-anchor="middle" font-family="Jua, Pretendard, sans-serif" font-size="14" fill="var(--ink)">3</text></svg>
    <button type="button" aria-label="내 위치" style="position: absolute; right: 10px; bottom: 10px; width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--ink); background: var(--card); box-shadow: 0 3px 0 var(--shadow); display: flex; align-items: center; justify-content: center; color: var(--ink); cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; top: 10px; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; box-sizing: border-box; border: 2px solid var(--ink); border-radius: 10px; background: var(--card); box-shadow: 3px 3px 0 var(--shadow)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--sub)"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <label for="qp2" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">장소 검색</label>
    <input id="qp2" type="search" placeholder="장소, 주소, 역 이름" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 13px; color: var(--ink); outline: none">
    <button type="button" class="h" style="height: 30px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 8px; background: var(--accent); color: #FFFFFF; font-size: 13px; cursor: pointer; box-shadow: 0 2px 0 var(--ink)">검색</button>
  </div>

  <section aria-label="일정 시트" style="position: absolute; left: 0; right: 0; bottom: 0; height: 384px; display: flex; flex-direction: column; border-top: 2px solid var(--ink); border-radius: 18px 18px 0 0; background: var(--card); box-shadow: 0 -4px 0 var(--shadow); overflow: hidden">
    <div style="display: flex; justify-content: center; padding: 7px 0 3px 0; background: var(--card)"><span aria-hidden="true" style="width: 40px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .35"></span></div>
    <header class="h" style="height: 44px; flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--h1); color: #FFFFFF; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink)">
      <span style="font-size: 18px">Day 2</span>
      <span style="font-family: 'Pretendard'; font-size: 12px; font-weight: 600; opacity: .92">9월 20일 (토)</span>
      <span style="flex: 1"></span>
      <span style="font-family: 'Pretendard'; font-size: 11px; font-weight: 700; background: #FFFFFF; color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 1px 8px">이동 1시간 12분</span>
    </header>
    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; background: var(--soft)">
      <article style="border: 2px solid var(--ink); border-radius: 10px; background: var(--card); overflow: hidden">
        <div class="h" style="height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 9px; background: var(--h2); color: #FFFFFF; border-bottom: 2px solid var(--ink); font-size: 13px"><span style="width: 18px; height: 18px; border-radius: 5px; background: #FFFFFF; color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 11px">2</span>시즈오카 센겐 신사</div>
        <div style="padding: 7px 9px"><span style="font-size: 12px; font-weight: 600">10:55 – 11:40 · 45분</span></div>
      </article>
      <div style="display: flex; align-items: center; gap: 8px; padding-left: 10px"><span style="width: 3px; height: 22px; background: var(--h2)"></span><span class="chip">대중교통 23분<span style="background: var(--est); border: 1.5px solid var(--ink); border-radius: 999px; padding: 1px 6px; font-size: 10px; color: #2A1D08">추정</span></span></div>
      <article style="border: 3px solid var(--accent); border-radius: 10px; background: var(--card); overflow: hidden; box-shadow: 3px 3px 0 var(--shadow)">
        <div class="h" style="height: 32px; display: flex; align-items: center; gap: 7px; padding: 0 9px; background: var(--accent); color: #FFFFFF; border-bottom: 2px solid var(--ink); font-size: 14px"><span style="width: 18px; height: 18px; border-radius: 5px; background: #FFFFFF; color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 11px">3</span>니혼다이라 전망대</div>
        <div style="padding: 7px 9px"><span style="font-size: 12px; font-weight: 600">12:05 – 13:30 · 1시간 25분</span></div>
      </article>
      <div style="display: flex; align-items: center; gap: 8px; padding-left: 10px"><span style="width: 3px; height: 22px; background: var(--h3)"></span><span class="chip" style="border-style: dashed; color: var(--sub)">자동차 18분 · 재계산 필요</span></div>
    </div>
    <footer style="flex: 0 0 auto; padding: 10px 12px 24px 12px; border-top: 2px solid var(--ink); background: var(--card); display: flex; justify-content: center">
      <button type="button" class="h" style="width: 366px; height: 50px; border: 2px solid var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; color: #FFFFFF; background: var(--accent); box-shadow: 0 3px 0 var(--ink); border-radius: 10px; clip-path: path('M12 0 H358 L366 8 V38 A12 12 0 0 1 354 50 H12 A12 12 0 0 1 0 38 V12 A12 12 0 0 1 12 0 Z')"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>AI 동선 최적화</button>
    </footer>
  </section>
</div>

<!-- ▼ 미리보기 전용 테마 셀렉터 — 구현 대상 아님. 앱에서는 설정 화면의 테마 선택이 이 역할을 한다. -->
<select id="themePreview" aria-label="테마 미리보기"
 style="position:fixed;right:10px;bottom:10px;z-index:9999;font:600 12px system-ui;padding:4px 6px;
 border:2px solid #2A3644;border-radius:8px;background:#FFF;box-shadow:0 2px 0 rgba(42,54,68,.3)"
 onchange="var r=document.querySelector('.v2');r.className='v2'+(this.value==='cloud'?'':' '+this.value)">
<option value="cloud">cloud (기본)</option><option>spring</option><option>summer</option><option>autumn</option>
<option>winter</option><option>korea</option><option>china</option><option>japan</option>
</select>
<!-- ▲ 미리보기 전용 끝 -->
</body>
</html>
