<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Tabiji 공통 상태 · Phone</title>
<!-- 디자인 원본. 수치가 이미지와 다르면 이 파일이 정답. 1px = 1dp -->
</head>
<body>
<style>
@font-face{font-family:"Pretendard";font-weight:400;src:url(../assets/fonts/PretendardJP-Regular.ttf) format("truetype")}
@font-face{font-family:"Pretendard";font-weight:500;src:url(../assets/fonts/PretendardJP-Medium.ttf) format("truetype")}
@font-face{font-family:"Pretendard";font-weight:600;src:url(../assets/fonts/PretendardJP-SemiBold.ttf) format("truetype")}
@font-face{font-family:"Sora";font-weight:600;src:url(../assets/fonts/Sora-SemiBold.ttf) format("truetype")}
body{margin:0;font-family:"Pretendard",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#1A78A8}a:hover{color:#2FA8E0}
.tj{--bg-top:#EAF3FB;--bg-bot:#F7F9FC;--glass:rgba(255,255,255,.72);--card:rgba(255,255,255,.82);--chip:rgba(255,255,255,.9);--silver-from:#F4F6F9;--silver-to:#C9D1DB;--hl:rgba(255,255,255,.8);--line:#D5DCE4;--text:#1C2633;--text2:#5B6878;--accent:#2FA8E0;--accent-text:#1A78A8;--on-accent:#0E1621;--est:#E3A23B;--err:#D9534F;--err-soft:rgba(217,83,79,.12);--skeleton:#E6EBF1;--skeleton-hi:#F3F6F9;--shadow:0 8px 24px rgba(28,38,51,.10)}
.tj.dark{--bg-top:#0E1621;--bg-bot:#18212D;--glass:rgba(30,39,51,.72);--card:rgba(30,39,51,.82);--chip:rgba(36,46,60,.9);--silver-from:#2A3441;--silver-to:#3A4655;--hl:rgba(255,255,255,.14);--line:#334051;--text:#E9EEF4;--text2:#9AA7B6;--accent:#5CC3F0;--accent-text:#5CC3F0;--on-accent:#0E1621;--est:#F0B862;--err:#F07A76;--err-soft:rgba(240,122,118,.16);--skeleton:#2A3441;--skeleton-hi:#354253;--shadow:0 8px 24px rgba(0,0,0,.35)}
@keyframes tj-shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
@media (prefers-reduced-motion: reduce){.tj *{animation:none !important}}
</style>
<div class="tj light" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: 'Pretendard', system-ui, sans-serif; color: var(--text); background: linear-gradient(180deg, var(--bg-top), var(--bg-bot))">
  <div style="position: absolute; inset: 0; overflow-y: auto; padding: 56px 16px 32px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; color: var(--text2)">오프라인 필 (지도 상단 중앙, 상태바 아래 8dp)</h2>
      <div style="position: relative; height: 96px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line)">
        <img src="../assets/map/map_light.svg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.9; filter: saturate(0.6)">
        <div role="status" style="position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--hl), var(--shadow); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--text2)"><path d="M3 3l18 18"/><path d="M8.5 19H17a4 4 0 0 0 .9-7.9A6 6 0 0 0 7.6 8.6"/><path d="M5.3 9.6A4.5 4.5 0 0 0 7.5 19h1"/></svg>
          <span>오프라인 · 저장된 일정 표시 중</span>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; color: var(--text2)">오류 배너 (시트 안 최상단, 콘텐츠 유지)</h2>
      <div role="alert" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--err-soft); border: 1px solid var(--err); color: var(--text)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--err); flex: 0 0 auto"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v5M12 16h.01"/></svg>
        <span style="font-size: 13px; flex: 1; line-height: 17px">이동시간을 불러오지 못했어요. 마지막 값 표시 중</span>
        <button type="button" style="height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap">다시 시도</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; color: var(--text2)">로딩 스켈레톤 (카드·칩 구조 유지)</h2>
      <div aria-busy="true" style="border-radius: 16px; background: var(--glass); border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--hl), var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; gap: 12px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card)"><span style="width: 28px; height: 28px; border-radius: 999px; background: var(--skeleton)"></span><div style="display: flex; flex-direction: column; gap: 8px; flex: 1"><span style="width: 50%; height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--skeleton) 0%, var(--skeleton-hi) 50%, var(--skeleton) 100%); background-size: 400px 100%; animation: tj-shimmer 1.2s linear infinite"></span><span style="width: 32%; height: 12px; border-radius: 6px; background: var(--skeleton)"></span></div></div>
        <div style="display: flex; align-items: center; gap: 8px; padding-left: 14px; height: 32px"><span style="width: 2px; height: 32px; background: var(--line)"></span><span style="width: 120px; height: 28px; border-radius: 999px; background: var(--skeleton)"></span></div>
        <div style="display: flex; gap: 12px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card)"><span style="width: 28px; height: 28px; border-radius: 999px; background: var(--skeleton)"></span><div style="display: flex; flex-direction: column; gap: 8px; flex: 1"><span style="width: 60%; height: 14px; border-radius: 6px; background: var(--skeleton)"></span><span style="width: 36%; height: 12px; border-radius: 6px; background: var(--skeleton)"></span></div></div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; color: var(--text2)">빈 상태 (여행 목록)</h2>
      <div style="border-radius: 16px; background: var(--glass); border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--hl), var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px 16px; text-align: center">
        <svg width="56" height="56" viewBox="0 0 64 64" fill="none" aria-hidden="true"><defs><linearGradient id="emkp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F6F9"/><stop offset="1" stop-color="#C9D1DB"/></linearGradient></defs><path d="M32 6 C19 6 10 15.5 10 28 C10 44 32 60 32 60 C32 60 54 44 54 28 C54 15.5 45 6 32 6 Z" fill="url(#emkp)" stroke="#AEB8C4" stroke-width="1.5"/><circle cx="32" cy="28" r="9" fill="#FFFFFF"/><path d="M32 24v8M28 28h8" stroke="#2FA8E0" stroke-width="2" stroke-linecap="round"/></svg>
        <span style="font-size: 16px; font-weight: 600">아직 여행이 없어요</span>
        <span style="font-size: 13px; color: var(--text2); line-height: 18px">지역과 날짜만 정하면<br>지도 위에서 바로 일정을 만들 수 있어요</span>
        <button type="button" style="width: 180px; height: 48px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font: inherit; font-size: 14px; font-weight: 600; color: var(--on-accent); background: var(--accent); box-shadow: inset 0 1px 0 rgba(255,255,255,.55); clip-path: path('M12 0 H172 L180 8 V36 A12 12 0 0 1 168 48 H12 A12 12 0 0 1 0 36 V12 A12 12 0 0 1 12 0 Z')">첫 여행 만들기</button>
      </div>
    </section>
  </div>
</div>
</body>
</html>
