# ── Tabiji ──────────────────────────────────────────────
# 앱 버전의 단일 원본. Android versionName/versionCode, Desktop packageVersion이 여기서 계산된다.
# client-vX.Y.Z 태그와 반드시 같아야 한다 (다르면 Release CI 실패). 형식: MAJOR.MINOR.PATCH, MINOR·PATCH는 0~99
tabiji.version=0.1.2

# ── Kotlin ──────────────────────────────────────────────
# Kotlin 공식 코드 스타일을 IDE 포매터 기본값으로 쓴다
kotlin.code.style=official
# Kotlin 컴파일 데몬 최대 힙. KMP + Compose 컴파일은 메모리를 많이 쓴다
kotlin.daemon.jvmargs=-Xmx3072M

# ── Gradle ──────────────────────────────────────────────
# Gradle 데몬 최대 힙과 파일 인코딩(한글 주석·문자열 깨짐 방지)
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
# 설정 단계 결과를 캐시해 두 번째 빌드부터 빠르게 시작한다
org.gradle.configuration-cache=true
# 태스크 출력을 캐시해 바뀌지 않은 부분은 다시 빌드하지 않는다
org.gradle.caching=true

# ── Android ─────────────────────────────────────────────
# 각 모듈의 R 클래스에 자기 리소스만 담는다 (빌드 속도, 의존 명확성)
android.nonTransitiveRClass=true
# 지원 라이브러리 대신 AndroidX를 쓴다
android.useAndroidX=true
